[remote_common]
platform = espressif32
framework = arduino
monitor_speed = 115200
lib_ldf_mode = deep+
lib_extra_dirs =
	../lib
lib_deps =
	adafruit/Adafruit NeoPixel @ ^1.12.3
	madhephaestus/ESP32Encoder
	lovyan03/LovyanGFX
	links2004/WebSockets @ ^2.6.1
	WiFiClientSecure
	https://github.com/lewisxhe/SensorsLib.git
	https://github.com/lewisxhe/XPowersLib.git#v0.3.1
build_flags =
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=1
	-Iinclude
	-I$PROJECT_PACKAGES_DIR/framework-arduinoespressif32/libraries/WiFi/src
	-I$PROJECT_PACKAGES_DIR/framework-arduinoespressif32/libraries/WiFiClientSecure/src
	-I$PROJECT_PACKAGES_DIR/framework-arduinoespressif32/libraries/Network/src
	-I$PROJECT_PACKAGES_DIR/framework-arduinoespressif32/libraries/FS/src

[env:remote-universal-s3]
extends = remote_common
board = sg98_remote_universal_esp32s3

[env:remote-crowpanel-128]
extends = remote_common
board = crowpanel_rotary_esp32s3
build_flags =
	${remote_common.build_flags}
	-DREMOTE_BOARD_FORCE_CROWPANEL_128

[env:remote-crowpanel-21]
extends = remote_common
board = sg98_remote_universal_esp32s3
build_flags =
	${remote_common.build_flags}
	-DREMOTE_BOARD_FORCE_CROWPANEL_21

[env:remote-waveshare-175]
extends = remote_common
board = waveshare_esp32_s3_touch_amoled_175
build_flags =
	${remote_common.build_flags}
	-DREMOTE_BOARD_FORCE_WAVESHARE_175

[env:remote-crowpanel-128-diag]
extends = remote_common
board = crowpanel_rotary_esp32s3
build_flags =
	${remote_common.build_flags}
	-DREMOTE_CROWPANEL_128_DIAG
