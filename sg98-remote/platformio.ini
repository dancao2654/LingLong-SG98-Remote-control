[platformio]
extra_configs = ../tools/platformio_shared.ini
default_envs = remote-universal-s3

[remote_common]
platform = ${sg98_shared.platform}
framework = ${sg98_shared.framework}
monitor_speed = ${sg98_shared.monitor_speed}
lib_ldf_mode = ${sg98_shared.remote_lib_ldf_mode}
platform_packages = ${sg98_shared.platform_packages}
extra_scripts =
	pre:../tools/platformio_pioarduino_path_fix.py
	post:../tools/platformio_custom_targets.py
	post:../tools/windows_updater/platformio_bundle.py
lib_extra_dirs =
	../lib
	$PROJECT_PACKAGES_DIR/framework-arduinoespressif32/libraries
lib_deps = ${sg98_shared.remote_lib_deps}
build_flags =
	${sg98_shared.remote_build_flags}
	-Iinclude

[env:remote-universal-s3]
extends = remote_common
board = sg98_remote_universal_esp32s3

[env:remote-crowpanel-128]
extends = remote_common
board = crowpanel_rotary_esp32s3
build_flags =
	${remote_common.build_flags}
	${sg98_shared.remote_crowpanel_128_build_flags}

[env:remote-crowpanel-21]
extends = remote_common
board = sg98_remote_universal_esp32s3
build_flags =
	${remote_common.build_flags}
	${sg98_shared.remote_crowpanel_21_build_flags}

[env:remote-waveshare-175]
extends = remote_common
board = waveshare_esp32_s3_touch_amoled_175
build_flags =
	${remote_common.build_flags}
	${sg98_shared.remote_waveshare_175_build_flags}

[env:remote-crowpanel-128-diag]
extends = remote_common
board = crowpanel_rotary_esp32s3
build_flags =
	${remote_common.build_flags}
	${sg98_shared.remote_crowpanel_128_diag_build_flags}
