[remote_common]
platform = espressif32
framework = arduino
monitor_speed = 115200
lib_ldf_mode = deep+
lib_extra_dirs =
	../lib
lib_deps =
	adafruit/Adafruit NeoPixel @ ^1.12.3
	madhephaestus/ESP32Encoder
	lovyan03/LovyanGFX
	https://github.com/lewisxhe/SensorsLib.git
	https://github.com/lewisxhe/XPowersLib.git#v0.3.1
build_flags =
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=1
	-Iinclude

[env:remote-universal-s3]
extends = remote_common
board = sg98_remote_universal_esp32s3
