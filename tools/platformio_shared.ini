[sg98_shared]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38-1/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
platform_packages =
	tool-esptoolpy@https://github.com/pioarduino/registry/releases/download/0.0.1/esptoolpy-v5.2.0.zip
	framework-arduinoespressif32@https://github.com/espressif/arduino-esp32/releases/download/3.3.8/esp32-core-3.3.8.tar.xz
common_usb_build_flags =
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=1
controller_lib_deps =
	jchristensen/JC_Button @ ^2.1.2
	madhephaestus/ESP32Encoder
	adafruit/Adafruit GFX Library @ ^1.10.1
	links2004/WebSockets @ ^2.6.1
	https://github.com/adafruit/Adafruit-ST7735-Library.git
	h2zero/NimBLE-Arduino @ ^2.5.0
	lvgl/lvgl @ ^8.4.0
controller_build_flags =
	${sg98_shared.common_usb_build_flags}
	-Iinclude
	-I$PROJECT_PACKAGES_DIR/framework-arduinoespressif32/libraries/NetworkClientSecure/src
	-DLV_CONF_INCLUDE_SIMPLE
controller_adafruit_build_flags =
	-DSG98_CONTROLLER_FORCE_ADAFRUIT_FEATHER=1
controller_waveshare_build_flags =
	-DBOARD_HAS_PSRAM
	-DSG98_CONTROLLER_FORCE_WAVESHARE_RS485_CAN=1
remote_lib_ldf_mode = chain+
remote_lib_deps =
	adafruit/Adafruit GFX Library @ ^1.10.1
	adafruit/Adafruit NeoPixel @ ^1.12.3
	madhephaestus/ESP32Encoder
	https://github.com/lovyan03/LovyanGFX.git#c14105d8a0f8b431e4fdb0b7d0757d5100ca2159
	links2004/WebSockets @ ^2.6.1
	h2zero/NimBLE-Arduino @ ^2.5.0
	https://github.com/lewisxhe/SensorsLib.git
	https://github.com/lewisxhe/XPowersLib.git#v0.3.1
remote_build_flags =
	${sg98_shared.common_usb_build_flags}
	-I$PROJECT_PACKAGES_DIR/framework-arduinoespressif32/libraries/WiFi/src
	-I$PROJECT_PACKAGES_DIR/framework-arduinoespressif32/libraries/NetworkClientSecure/src
	-I$PROJECT_PACKAGES_DIR/framework-arduinoespressif32/libraries/Network/src
	-I$PROJECT_PACKAGES_DIR/framework-arduinoespressif32/libraries/FS/src
	-Wno-cpp
	-Wno-deprecated-declarations
remote_crowpanel_128_build_flags =
	-DREMOTE_BOARD_FORCE_CROWPANEL_128
remote_crowpanel_21_build_flags =
	-DREMOTE_BOARD_FORCE_CROWPANEL_21
remote_waveshare_175_build_flags =
	-DREMOTE_BOARD_FORCE_WAVESHARE_175
remote_crowpanel_128_diag_build_flags =
	-DREMOTE_CROWPANEL_128_DIAG
