name: Remote Builds

on:
  push:
    paths:
      - ".github/workflows/remote-build.yml"
      - "sg98-remote/**"
      - "tools/**"
  pull_request:
    paths:
      - ".github/workflows/remote-build.yml"
      - "sg98-remote/**"
      - "tools/**"
  workflow_dispatch:

jobs:
  remote-build:
    name: "${{ matrix.os }} / ${{ matrix.env }}"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest
        env:
          - remote-universal-s3
          - remote-crowpanel-128
          - remote-crowpanel-21
          - remote-waveshare-175

    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            C:\Users\runneradmin\.platformio
          key: ${{ runner.os }}-platformio-${{ hashFiles('sg98-remote/platformio.ini', 'tools/platformio_shared.ini', 'tools/platformio_pioarduino_path_fix.py', 'sg98-remote/boards/*.json') }}
          restore-keys: |
            ${{ runner.os }}-platformio-

      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio

      - name: Build ${{ matrix.env }}
        run: pio run -d sg98-remote -e ${{ matrix.env }}
