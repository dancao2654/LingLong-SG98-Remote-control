; PlatformIO Project Configuration File
;
; Root project for the SG98 controller firmware, with remote hardware aliases so
; all shipped hardware variants can be built from one PlatformIO task tree.

[platformio]
boards_dir = sg98-remote/boards
extra_configs = tools/platformio_shared.ini
default_envs = controller-universal-s3, remote-universal-s3

[controller_common]
platform = ${sg98_shared.platform}
framework = ${sg98_shared.framework}
monitor_speed = ${sg98_shared.monitor_speed}
platform_packages = ${sg98_shared.platform_packages}
extra_scripts =
	pre:tools/platformio_pioarduino_path_fix.py
	pre:tools/platformio_version.py
	post:tools/platformio_custom_targets.py
	post:tools/windows_updater/platformio_bundle.py
lib_deps = ${sg98_shared.controller_lib_deps}
build_flags = ${sg98_shared.controller_build_flags}

[env:adafruit_feather_esp32s3]
extends = controller_common
board = adafruit_feather_esp32s3
board_build.partitions = huge_app.csv
build_flags =
	${controller_common.build_flags}
	${sg98_shared.controller_adafruit_build_flags}

[env:controller-universal-s3]
extends = controller_common
board = sg98_remote_universal_esp32s3
board_upload.flash_size = 8MB
board_build.flash_size = 8MB
board_build.partitions = partitions/controller_8mb_ota.csv

[env:controller-universal-s3-headless-sim]
extends = controller_common
board = esp32-s3-devkitc-1
board_upload.flash_size = 8MB
board_build.flash_size = 8MB
board_build.partitions = partitions/controller_8mb_ota.csv
build_flags =
	${controller_common.build_flags}
	${sg98_shared.controller_headless_sim_build_flags}

[env:waveshare_esp32_s3_rs485_can]
extends = controller_common
board = esp32-s3-devkitc-1
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
build_flags =
	${controller_common.build_flags}
	${sg98_shared.controller_waveshare_build_flags}

[env:controller-lilygo-t4-s3-h678]
extends = controller_common
board = lilygo_t4_s3_h678
build_flags =
	${controller_common.build_flags}
	${sg98_shared.controller_lilygo_t4_s3_h678_build_flags}

[remote_common]
platform = ${sg98_shared.platform}
framework = ${sg98_shared.framework}
monitor_speed = ${sg98_shared.monitor_speed}
lib_ldf_mode = ${sg98_shared.remote_lib_ldf_mode}
platform_packages = ${sg98_shared.platform_packages}
extra_scripts =
	pre:tools/platformio_pioarduino_path_fix.py
	pre:tools/platformio_version.py
	post:tools/platformio_custom_targets.py
	post:tools/windows_updater/platformio_bundle.py
build_src_filter =
	-<*>
	+<../sg98-remote/src/>
lib_extra_dirs =
	sg98-remote/lib
	lib
	$PROJECT_PACKAGES_DIR/framework-arduinoespressif32/libraries
lib_deps = ${sg98_shared.remote_lib_deps}
build_flags =
	${sg98_shared.remote_build_flags}
	-Isg98-remote/include

[env:remote-universal-s3]
extends = remote_common
board = sg98_remote_universal_esp32s3
build_flags =
	${remote_common.build_flags}
	${sg98_shared.remote_lilygo_t4_s3_h678_probe_build_flags}

[env:remote-crowpanel-128]
extends = remote_common
board = crowpanel_rotary_esp32s3
build_flags =
	${remote_common.build_flags}
	${sg98_shared.remote_crowpanel_128_build_flags}

[env:remote-crowpanel-21]
extends = remote_common
board = sg98_remote_universal_esp32s3
build_flags =
	${remote_common.build_flags}
	${sg98_shared.remote_crowpanel_21_build_flags}

[env:remote-waveshare-175]
extends = remote_common
board = waveshare_esp32_s3_touch_amoled_175
build_flags =
	${remote_common.build_flags}
	${sg98_shared.remote_waveshare_175_build_flags}

[env:remote-lilygo-t4-s3-h678]
extends = remote_common
board = lilygo_t4_s3_h678
build_flags =
	${remote_common.build_flags}
	${sg98_shared.remote_lilygo_t4_s3_h678_build_flags}

[env:remote-crowpanel-128-diag]
extends = remote_common
board = crowpanel_rotary_esp32s3
build_flags =
	${remote_common.build_flags}
	${sg98_shared.remote_crowpanel_128_diag_build_flags}

; Hardware bring-up: fixed TSE/onboard bus; only reads and stop writes allowed.
[env:controller-kfm-commissioning]
extends = env:controller-universal-s3
build_flags =
    ${controller_common.build_flags}
    ${sg98_shared.controller_waveshare_build_flags}
    -DSG98_TSE_KFM_COMMISSIONING=1

; Explicit, operator-present enable-at-zero experiment. No RPM!=0 writes.
[env:controller-kfm-zero-probe]
extends = env:controller-kfm-commissioning
build_flags =
    ${env:controller-kfm-commissioning.build_flags}
    -DSG98_TSE_KFM_ZERO_PROBE=1

; Disabled-drive PA25 temporary-marker audit; SON=1 is forbidden.
[env:controller-kfm-pa25-probe]
extends = env:controller-kfm-commissioning
build_flags =
    ${env:controller-kfm-commissioning.build_flags}
    -DSG98_TSE_KFM_PA25_PROBE=1

; Explicit supervised fixed100rpm / nominal2-second pulse only. UI starts locked.
[env:controller-kfm-pa25-pulse]
extends = env:controller-kfm-commissioning
build_flags =
    ${env:controller-kfm-commissioning.build_flags}
    -DSG98_TSE_KFM_PA25_PULSE=1

; One-shot touchscreen Start/Stop, fixed100rpm/max5s, fresh USB arm required.
[env:controller-kfm-pa25-touch-test]
extends = env:controller-kfm-pa25-pulse
build_flags =
    ${env:controller-kfm-pa25-pulse.build_flags}
    -DSG98_TSE_KFM_TOUCH_TEST=1

; Operator-present full state-machine candidate, PA25 only, 800rpm / 30s cap.
; No pulse/probe macros. Explicit USB session arm and fresh touchscreen required.
[env:controller-kfm-run-candidate]
extends = env:controller-kfm-commissioning
build_flags =
    ${env:controller-kfm-commissioning.build_flags}
    -DSG98_TSE_KFM_ALLOW_MOTION=1
    -DSG98_TSE_KFM_RUN_CANDIDATE=1
    -DSG98_TSE_KFM_MAX_RPM=800

; OFFLINE CANDIDATE ONLY: no PC required for explicit user Start.
; 2000rpm requested envelope, 120s maximum operation, fault-stop acknowledgement.
; Does not establish drive-side stop on broken RS485/dead controller.
[env:controller-kfm-standalone-candidate]
extends = env:controller-kfm-commissioning
build_flags =
    ${env:controller-kfm-commissioning.build_flags}
    -DSG98_TSE_KFM_ALLOW_MOTION=1
    -DSG98_TSE_KFM_RUN_CANDIDATE=1
    -DSG98_TSE_KFM_STANDALONE=1
    -DSG98_TSE_KFM_MAX_RPM=2000
    -DSG98_TSE_KFM_OPERATION_MS=120000

; Paired touch firmware: Start/Stop intent tokens survive retransmission.
[env:remote-waveshare-175-standalone-candidate]
extends = env:remote-waveshare-175
