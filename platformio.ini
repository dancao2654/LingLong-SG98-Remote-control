; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
boards_dir = sg98-remote/boards

[env:adafruit_feather_esp32s3]
platform = espressif32
platform_packages = platformio/tool-esptoolpy@^2.41100.0
board = adafruit_feather_esp32s3
framework = arduino
monitor_speed = 115200
extra_scripts =
	post:tools/platformio_custom_targets.py
	post:tools/windows_updater/platformio_bundle.py
lib_deps =
	jchristensen/JC_Button @ ^2.1.2
	madhephaestus/ESP32Encoder
	adafruit/Adafruit GFX Library @ ^1.10.1
	links2004/WebSockets @ ^2.6.1
	https://github.com/adafruit/Adafruit-ST7735-Library.git
	https://github.com/isPointless/ESP32Arduino-BLEScale
build_flags = 
	'-D ARDUINO_USB_CDC_ON_BOOT=1'
	'-D ARDUINO_USB_MODE=1'

[env:waveshare_esp32_s3_rs485_can]
platform = espressif32
platform_packages = platformio/tool-esptoolpy@^2.41100.0
board = esp32-s3-devkitc-1
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
framework = arduino
monitor_speed = 115200
extra_scripts =
	post:tools/platformio_custom_targets.py
	post:tools/windows_updater/platformio_bundle.py
lib_deps =
	jchristensen/JC_Button @ ^2.1.2
	madhephaestus/ESP32Encoder
	adafruit/Adafruit GFX Library @ ^1.10.1
	links2004/WebSockets @ ^2.6.1
	https://github.com/adafruit/Adafruit-ST7735-Library.git
	https://github.com/isPointless/ESP32Arduino-BLEScale
build_flags =
	'-D ARDUINO_USB_CDC_ON_BOOT=1'
	'-D ARDUINO_USB_MODE=1'
	'-D BOARD_HAS_PSRAM'
	'-D SG98_CONTROLLER_BOARD_WAVESHARE_RS485_CAN=1'

[remote_common]
platform = espressif32
framework = arduino
monitor_speed = 115200
extra_scripts =
	post:tools/platformio_custom_targets.py
	post:tools/windows_updater/platformio_bundle.py
lib_ldf_mode = deep+
build_src_filter =
	-<*>
	+<../sg98-remote/src/>
lib_extra_dirs =
	sg98-remote/lib
	lib
lib_deps =
	adafruit/Adafruit NeoPixel @ ^1.12.3
	madhephaestus/ESP32Encoder
	lovyan03/LovyanGFX
	links2004/WebSockets @ ^2.6.1
	WiFiClientSecure
	https://github.com/lewisxhe/SensorsLib.git
	https://github.com/lewisxhe/XPowersLib.git#v0.3.1
build_flags =
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=1
	-Isg98-remote/include
	-I$PROJECT_PACKAGES_DIR/framework-arduinoespressif32/libraries/WiFi/src
	-I$PROJECT_PACKAGES_DIR/framework-arduinoespressif32/libraries/WiFiClientSecure/src
	-I$PROJECT_PACKAGES_DIR/framework-arduinoespressif32/libraries/Network/src
	-I$PROJECT_PACKAGES_DIR/framework-arduinoespressif32/libraries/FS/src

[env:remote-universal-s3]
extends = remote_common
board = sg98_remote_universal_esp32s3
